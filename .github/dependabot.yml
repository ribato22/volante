# This project shipped a dead MCP server once, in 0.3.1: an unbounded `mcp>=1.2`
# resolved to a 2.0.0 release that removed the module `volante_mcp` imports, and
# every published install path died while CI stayed green because uv.lock pinned an
# older version. A version-bump PR that CI must pass is the cheapest guard against
# the next one.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # `mcp` 2.0.0 removed `mcp.server.fastmcp`, which volante_mcp imports. The
      # `<2` ceiling in pyproject.toml IS the 0.3.2 fix for every published install
      # path being dead, and Dependabot proposed widening it to `<3` within an hour
      # of this file existing (PR #4, closed). CI caught it, which is the system
      # working -- but a major bump here is a MIGRATION, not a version bump, and it
      # only happens after volante_mcp stops importing that module.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"

  # Every `uses:` in this repo is pinned to a full commit SHA on purpose, including
  # the OIDC-privileged publish action. Dependabot keeps those pins current instead
  # of letting them rot into "pinned to something ancient".
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
