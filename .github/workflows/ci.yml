name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo contents.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy; enforces the shipped py.typed promise)
        run: uv run mypy src/volante

      - name: Test (no network; integration tests skipped by default)
        run: uv run pytest --cov=src/volante --cov=eval --cov-report=term-missing

  build:
    name: build & package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build sdist + wheel
        run: uv build

      - name: Check package metadata (twine)
        run: uvx twine check dist/*

      - name: Wheel-install smoke test
        # Catches packaging regressions a unit test can't (accidental webui/ or docs/
        # inclusion, a broken `volante` console-script entrypoint, missing dependency
        # metadata) by installing the built wheel into a throwaway venv — separate
        # from the dev environment `uv sync --dev` builds for the test job above.
        run: |
          python3 -m venv /tmp/volante-wheel-venv
          /tmp/volante-wheel-venv/bin/pip install --quiet dist/*.whl
          /tmp/volante-wheel-venv/bin/volante --version
          /tmp/volante-wheel-venv/bin/volante --help

      - name: MCP extra resolves against LIVE PyPI, not the lockfile
        # The gap that let a released version ship a dead MCP server. The smoke test
        # above never installed the `mcp` extra, and every other job resolves through
        # uv.lock — which pinned an old `mcp`. So when mcp 2.0.0 removed
        # mcp.server.fastmcp, every published install path (uvx, MCPB, the Claude Code
        # plugin, Smithery, the registry record) broke while CI stayed green.
        #
        # Deliberately UNLOCKED: this must resolve the newest releases a user would
        # get today, so an upstream major bump fails here instead of in their terminal.
        run: |
          python3 -m venv /tmp/volante-mcp-venv
          /tmp/volante-mcp-venv/bin/pip install --quiet "$(ls dist/*.whl)[mcp]"
          /tmp/volante-mcp-venv/bin/python -c "import mcp; print('mcp', getattr(mcp, '__version__', '?'))"
          # Import what the server actually imports, not just the package.
          /tmp/volante-mcp-venv/bin/python -c "import volante_mcp; print('volante_mcp OK')"
          # And prove the console script starts rather than dying on an import.
          /tmp/volante-mcp-venv/bin/volante-mcp --help >/dev/null 2>&1 \
            || /tmp/volante-mcp-venv/bin/python -c "from volante_mcp import main; print('entrypoint OK')"
